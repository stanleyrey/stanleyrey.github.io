name: Rebuild photo wall manifest

on:
  push:
    branches: [main]
    paths:
      - "wall/**"
      - "!wall/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python wall/build_manifest.py
      - name: Commit manifest if it changed
        run: |
          if git diff --quiet -- wall/manifest.json; then
            echo "manifest unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wall/manifest.json
          git commit -m "chore(wall): rebuild manifest"
          git push
