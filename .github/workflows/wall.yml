name: Rebuild photo wall manifest

on:
  push:
    branches: [main]
    paths:
      - "wall/**"
      - "!wall/manifest.json"
      - "!wall/_thumbs/**"
      - "!wall/_large/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python wall/build_manifest.py
      - name: Commit manifest and derivatives if anything changed
        run: |
          git add wall/manifest.json wall/_thumbs wall/_large
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(wall): rebuild manifest and thumbnails"
          git push
